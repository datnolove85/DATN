spring.application.name=Backend

# Runs with embedded H2 mock data by default. Use --spring.profiles.active=sqlserver for SQL Server.
spring.profiles.default=local
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Secrets must be supplied through environment variables, not committed to Git.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

ghn.token=${GHN_TOKEN:}
ghn.shop-id=${GHN_SHOP_ID:0}
huggingface.space-url=${HF_SPACE_URL:https://yisol-idm-vton.hf.space}
huggingface.tryon-endpoint=${HF_TRYON_ENDPOINT:/tryon}
huggingface.timeout-seconds=${HF_TIMEOUT_SECONDS:300}
app.product-upload-dir=${PRODUCT_UPLOAD_DIR:uploads/sanpham}

# Gemini chatbot. Set GEMINI_API_KEY in the environment; never expose it to the browser.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
gemini.timeout-millis=${GEMINI_TIMEOUT_MILLIS:30000}
