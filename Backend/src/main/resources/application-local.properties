# H2 runs in memory, creates schema from current entities, and loads mock data.
spring.datasource.url=jdbc:h2:mem:shop_mock;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Do not attempt an email connection when running local mock data.
spring.mail.test-connection=false
